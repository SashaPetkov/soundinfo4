<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-FSK Аудио Модем</title>
    <style>
        body { font-family: monospace, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 160px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .monitor { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
    </style>
</head>
<body>

    <h2>M-FSK 16 Аудио Модем</h2>

    <div class="box">
        <h3>1. Передатчик (TX)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Привет!</textarea>
        <button id="sendBtn">▶ Отправить звук</button>
    </div>

    <div class="box">
        <h3>2. Приёмник (RX)</h3>
        <button id="listenBtn">🎙 Включить микрофон</button>
        <span id="listenStatus" class="status">Выключен</span>
        
        <div class="monitor">
            Частота: <span id="freqVal">0</span> Гц | Громкость: <span id="dbVal">-100</span> dB
        </div>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог детектора:</h4>
        <div id="log"></div>
    </div>

    <script>
        // --- НАСТРОЙКИ МОДЕМА ---
        const BASE_FREQ = 1200;   // Базовая частота
        const STEP_FREQ = 120;    // Шаг между тонами (Гц)
        const FREQ_START = 900;   // Маркер начала
        const FREQ_END = 3100;    // Маркер конца
        
        // 16 частот для данных (от 1200 до 3000 Гц)
        const DATA_FREQS = Array.from({length: 16}, (_, i) => BASE_FREQ + i * STEP_FREQ);

        const TONE_DURATION = 0.08;  // Длительность тона (80 мс)
        const PAUSE_DURATION = 0.04; // Пауза между тонами (20 мс)

        let audioCtx = null;
        let isListening = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        // ==========================================
        // 1. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            const ctx = getAudioContext();
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);

            const sequence = [];
            
            // Стартовый маркер (дублируем для надежности)
            sequence.push(FREQ_START, FREQ_START);

            // Кодирование байт в нибблы
            for (let b of bytes) {
                const highNibble = (b >> 4) & 0x0F;
                const lowNibble = b & 0x0F;
                sequence.push(DATA_FREQS[highNibble]);
                sequence.push(DATA_FREQS[lowNibble]);
            }

            // Стоповый маркер
            sequence.push(FREQ_END, FREQ_END);

            log(`[TX] Передача ${bytes.length} байт (${sequence.length} тонов)...`);

            let startTime = ctx.currentTime + 0.1;

            for (let freq of sequence) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.frequency.setValueAtTime(freq, startTime);
                osc.type = 'sine';

                // Плавное нарастание и затухание против щелчков
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.3, startTime + 0.005);
                gain.gain.setValueAtTime(0.3, startTime + TONE_DURATION - 0.005);
                gain.gain.linearRampToValueAtTime(0, startTime + TONE_DURATION);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + TONE_DURATION);

                startTime += TONE_DURATION + PAUSE_DURATION;
            }
        };

        // ==========================================
        // 2. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            if (isListening) return;

            const ctx = getAudioContext();
            try {
                // Отключаем обработку звука ОС, чтобы не резались писки
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";

                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 4096; // Высшее разрешение по частоте
                analyser.smoothingTimeConstant = 0.1;
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);

                let rxBuffer = [];
                let receiving = false;
                let lastDetectedNibble = -1;
                let sameNibbleCount = 0;

                const freqValEl = document.getElementById('freqVal');
                const dbValEl = document.getElementById('dbVal');

                function processAudio() {
                    if (!isListening) return;

                    analyser.getFloatFrequencyData(dataArray);

                    let maxDb = -Infinity;
                    let maxIndex = -1;

                    for (let i = 0; i < bufferLength; i++) {
                        if (dataArray[i] > maxDb) {
                            maxDb = dataArray[i];
                            maxIndex = i;
                        }
                    }

                    // Точный расчет частоты с учетом текущего sampleRate устройства
                    const detectedFreq = maxIndex * (ctx.sampleRate / analyser.fftSize);

                    freqValEl.innerText = Math.round(detectedFreq);
                    dbValEl.innerText = Math.round(maxDb);

                    // Порог громкости для отсечения тишины
                    if (maxDb > -75) { 
                        
                        // ДЕТЕКЦИЯ СТАРТА
                        if (!receiving && Math.abs(detectedFreq - FREQ_START) < 50) {
                            receiving = true;
                            rxBuffer = [];
                            log("[RX] Обнаружен старт!");
                        }

                        // ДЕТЕКЦИЯ СТОПА
                        else if (receiving && Math.abs(detectedFreq - FREQ_END) < 50) {
                            receiving = false;
                            log("[RX] Конец передачи.");
                            decodeBuffer(rxBuffer);
                        }

                        // ДЕТЕКЦИЯ ДАННЫХ
                        else if (receiving) {
                            for (let i = 0; i < 16; i++) {
                                if (Math.abs(detectedFreq - DATA_FREQS[i]) < 45) {
                                    if (i === lastDetectedNibble) {
                                        sameNibbleCount++;
                                        if (sameNibbleCount === 1) { 
                                            rxBuffer.push(i);
                                        }
                                    } else {
                                        lastDetectedNibble = i;
                                        sameNibbleCount = 0;
                                    }
                                    break;
                                }
                            }
                        }
                    }

                    requestAnimationFrame(processAudio);
                }

                processAudio();

            } catch (err) {
                alert("Ошибка микрофона: " + err);
            }
        };

        function decodeBuffer(nibbles) {
            log(`[RX] Принято нибблов: ${nibbles.length}`);
            
            if (nibbles.length % 2 !== 0) nibbles.pop();

            const bytes = [];
            for (let i = 0; i < nibbles.length; i += 2) {
                const byte = (nibbles[i] << 4) | nibbles[i + 1];
                bytes.push(byte);
            }

            const decoder = new TextDecoder();
            const decodedString = decoder.decode(new Uint8Array(bytes));
            
            document.getElementById('outputText').value = decodedString;
            log(`[RX] Результат: "${decodedString}"`);
        }
    </script>
</body>
</html>
