<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Link (GGWave Single-File + ACK)</title>
    <!-- Подключаем твой однофайловый ggwave.js -->
    <script src="ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 200px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .progress { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
    </style>
</head>
<body>

    <h2>Acoustic Modem (Embedded WASM + ACK Protocol)</h2>

    <div class="box">
        <h3>1. Устройство А (Передатчик)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Привет! Однофайловый GGWave с вшитым WASM работает отлично!</textarea>
        <button id="sendBtn">▶ Отправить с гарантией доставки</button>
    </div>

    <div class="box">
        <h3>2. Устройство Б (Приёмник)</h3>
        <button id="listenBtn">🎙 Включить микрофон приёмника</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="progress">
            Статус приёма: <span id="pktStatus">Ожидание...</span>
        </div>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог обмена:</h4>
        <div id="log"></div>
    </div>

    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;

        let context = null;
        let recorder = null;
        let mediaStream = null;

        let ggwave = null;
        let parameters = null;
        let instance = null;

        let isListening = false;
        let pendingAck = null;
        let receivedChunks = {};

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function convertTypedArray(src, type) {
            var buffer = new ArrayBuffer(src.byteLength);
            new src.constructor(buffer).set(src);
            return new type(buffer);
        }

        // Инициализация (так как WASM внутри, никаких доп. файлов указывать НЕ надо)
        window.onload = function() {
            log("[System] Загрузка встроенного ядра GGWave...");
            
            if (typeof ggwave_factory === 'undefined') {
                log("[Error] Ошибка: ggwave.js не подключен или имя файла отличается!");
                return;
            }

            // Просто вызываем фабрику без параметров!
            ggwave_factory().then(function(obj) {
                ggwave = obj;
                log("[System] Ядро GGWave успешно запущено из Base64!");
            }).catch(err => {
                log("[Error] Ошибка инициализации ядра: " + err);
            });
        };

        function initGGWave() {
            if (!context) {
                context = new AudioContext({ sampleRate: 48000 });

                parameters = ggwave.getDefaultParameters();
                parameters.sampleRateInp = context.sampleRate;
                parameters.sampleRateOut = context.sampleRate;
                instance = ggwave.init(parameters);
                
                log("[System] AudioContext и экземпляр GGWave подсоединены.");
            }
            if (context.state === 'suspended') {
                context.resume();
            }
        }

        function emitAudioSignal(text) {
            initGGWave();

            var waveform = ggwave.encode(instance, text, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);

            var buf = convertTypedArray(waveform, Float32Array);
            var buffer = context.createBuffer(1, buf.length, context.sampleRate);
            buffer.getChannelData(0).set(buf);

            var source = context.createBufferSource();
            source.buffer = buffer;
            source.connect(context.destination);
            source.start(0);
        }

        // ==========================================
        // 1. ЛОГИКА ПЕРЕДАТЧИКА (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            if (!ggwave) {
                alert("GGWave еще не инициализирован!");
                return;
            }
            initGGWave();
            
            const text = document.getElementById('inputText').value;
            if (!text) return;

            if (!isListening) await startReceiver();

            const CHUNK_SIZE = 35;
            const totalPackets = Math.ceil(text.length / CHUNK_SIZE);

            log(`[TX] Передача начата: всего пакетов ${totalPackets}`);

            for (let i = 0; i < totalPackets; i++) {
                const chunkText = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                
                const payload = JSON.stringify({
                    id: i,
                    total: totalPackets,
                    body: chunkText
                });

                let delivered = false;
                let attempts = 0;

                while (!delivered && attempts < 5) {
                    attempts++;
                    log(`[TX] Пакетик #${i} (Попытка ${attempts})...`);
                    
                    emitAudioSignal(payload);

                    const ackReceived = await waitForAck(i, 2500);

                    if (ackReceived) {
                        log(`[TX] Успешно! Доставлен ACK:${i}`);
                        delivered = true;
                        await sleep(300);
                    } else {
                        log(`[TX] Таймаут ACK:${i}. Повторная попытка...`);
                        await sleep(500);
                    }
                }

                if (!delivered) {
                    log(`[TX] ОШИБКА: Пакет #${i} не доставлен за 5 попыток.`);
                    return;
                }
            }

            log(`[TX] УСПЕХ! Вся цепочка доставлена.`);
        };

        function waitForAck(expectedId, timeoutMs) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (pendingAck === expectedId) {
                        clearInterval(checkInterval);
                        pendingAck = null;
                        resolve(true);
                    }
                }, 50);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (pendingAck === expectedId) {
                        pendingAck = null;
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                }, timeoutMs);
            });
        }

        // ==========================================
        // 2. ЛОГИКА ПРИЁМНИКА (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            await startReceiver();
        };

        async function startReceiver() {
            if (isListening) return;
            initGGWave();

            let constraints = {
                audio: {
                    echoCancellation: false,
                    autoGainControl: false,
                    noiseSuppression: false
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = context.createMediaStreamSource(stream);

                var bufferSize = 1024;
                if (context.createScriptProcessor) {
                    recorder = context.createScriptProcessor(bufferSize, 1, 1);
                } else {
                    recorder = context.createJavaScriptNode(bufferSize, 1, 1);
                }

                recorder.onaudioprocess = function (e) {
                    var source = e.inputBuffer;
                    var res = ggwave.decode(instance, convertTypedArray(new Float32Array(source.getChannelData(0)), Int8Array));

                    if (res && res.length > 0) {
                        const rawStr = new TextDecoder("utf-8").decode(res);
                        handleIncomingSignal(rawStr);
                    }
                };

                mediaStream.connect(recorder);
                recorder.connect(context.destination);

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";
                log("[RX] Микрофон активен.");

            } catch (err) {
                alert("Ошибка микрофона: " + err);
            }
        }

        function handleIncomingSignal(rawStr) {
            if (rawStr.startsWith("ACK:")) {
                const ackId = parseInt(rawStr.split(":")[1], 10);
                log(`[RX/TX Listener] Ответ поймали ACK:${ackId}`);
                pendingAck = ackId;
                return;
            }

            try {
                const pkt = JSON.parse(rawStr);
                if (pkt && typeof pkt.id === 'number') {
                    log(`[RX] Принят пакет #${pkt.id}/${pkt.total}. Пикуем ACK:${pkt.id}...`);
                    
                    receivedChunks[pkt.id] = pkt.body;
                    document.getElementById('pktStatus').innerText = `Принято: ${Object.keys(receivedChunks).length} / ${pkt.total}`;

                    setTimeout(() => {
                        emitAudioSignal(`ACK:${pkt.id}`);
                    }, 250);

                    if (Object.keys(receivedChunks).length === pkt.total) {
                        assembleFinalData(receivedChunks, pkt.total);
                    }
                }
            } catch (e) {}
        }

        function assembleFinalData(chunksMap, total) {
            let fullText = "";
            for (let i = 0; i < total; i++) {
                fullText += chunksMap[i] || "";
            }
            document.getElementById('outputText').value = fullText;
            log(`[RX] ГОТОВО! Собрано символов: ${fullText.length}.`);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
