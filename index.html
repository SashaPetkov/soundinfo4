<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Acoustic Packet Transfer</title>
    <script src="ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea, input { width: 100%; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; font-family: monospace; }
        textarea { height: 80px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 200px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .progress { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
        .vu-wrapper { width: 100%; background: #111; height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; border: 1px solid #444; }
        .vu-bar { height: 100%; width: 0%; background: #4ec9b0; transition: width 0.05s ease-out; }
    </style>
</head>
<body>

    <h2>Простая пакетированная акустическая передача</h2>

    <div class="box">
        <h3>1. Устройство А (Передатчик)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Привет! Это тестовая строка для проверки акустической передачи пакетами через GGWave.</textarea>
        <button id="sendBtn">▶ Отправить данные</button>
    </div>

    <div class="box">
        <h3>2. Устройство Б (Приёмник)</h3>
        <button id="listenBtn">🎙 Включить микрофон приёмника</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="vu-wrapper" title="Уровень звука микрофона">
            <div id="vuBar" class="vu-bar"></div>
        </div>

        <div class="progress">
            Статус приёма: <span id="pktStatus">Ожидание...</span>
        </div>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
        <button id="clearBtn" style="background: #a12626; padding: 6px 10px; font-size: 11px;">Очистить</button>
    </div>

    <div class="box">
        <h4>Лог обмена:</h4>
        <div id="log"></div>
    </div>

    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;

        let context = null;
        let recorder = null;
        let mediaStream = null;

        let ggwave = null;
        let parameters = null;
        let instance = null;

        let isListening = false;
        let isTransmitting = false; 
        let deadTimeUntil = 0;      
        
        let currentSourceNode = null;
        let pendingSignal = null;
        let receivedChunks = {};

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function convertTypedArray(src, type) {
            var buffer = new ArrayBuffer(src.byteLength);
            new src.constructor(buffer).set(src);
            return new type(buffer);
        }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ И АУДИОЯДРО
        // ==========================================
        window.onload = function() {
            log("[System] Загрузка ядра GGWave...");
            ggwave_factory().then(function(obj) {
                ggwave = obj;
                log("[System] Ядро готово к работе.");
            });
        };

        function initGGWave() {
            if (!context) {
                context = new AudioContext({ sampleRate: 48000 });
                parameters = ggwave.getDefaultParameters();
                parameters.sampleRateInp = context.sampleRate;
                parameters.sampleRateOut = context.sampleRate;
                instance = ggwave.init(parameters);
            }
            if (context.state === 'suspended') context.resume();
        }

        function emitAudioSignal(text, deadTimeMs = 250) {
            return new Promise((resolve) => {
                initGGWave();
                if (currentSourceNode) { try { currentSourceNode.stop(); } catch(e) {} }

                isTransmitting = true;

                var waveform = ggwave.encode(instance, text, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);
                var buf = convertTypedArray(waveform, Float32Array);
                var buffer = context.createBuffer(1, buf.length, context.sampleRate);
                buffer.getChannelData(0).set(buf);

                currentSourceNode = context.createBufferSource();
                currentSourceNode.buffer = buffer;
                currentSourceNode.connect(context.destination);

                currentSourceNode.onended = () => {
                    deadTimeUntil = Date.now() + deadTimeMs;
                    setTimeout(() => {
                        isTransmitting = false;
                        resolve();
                    }, 20);
                };
                currentSourceNode.start(0);
            });
        }

        document.getElementById('clearBtn').onclick = () => {
            receivedChunks = {};
            document.getElementById('outputText').value = "";
            document.getElementById('pktStatus').innerText = "Ожидание...";
            log("[RX] Буфер очищен.");
        };

        // ==========================================
        // 1. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            if (!ggwave) return;
            initGGWave();
            
            const text = document.getElementById('inputText').value;
            if (!text) { alert("Введите текст!"); return; }

            if (!isListening) await startReceiver();

            await sleep(150);

            // Оптимальный размер порции текста в 1 пакете
            const CHUNK_SIZE = 20; 
            const totalPackets = Math.ceil(text.length / CHUNK_SIZE);

            log(`[TX] Старт передачи (${totalPackets} пакетов)...`);

            for (let i = 0; i < totalPackets; i++) {
                const chunkText = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);

                const payload = JSON.stringify({
                    i: i,
                    t: totalPackets,
                    d: chunkText
                });

                let delivered = false;
                let pktAttempts = 0;

                while (!delivered && pktAttempts < 5) {
                    pktAttempts++;
                    log(`[TX] Отправка пакета #${i + 1}/${totalPackets} (попытка ${pktAttempts})...`);
                    
                    await emitAudioSignal(payload, 200);

                    const ack = await waitForSignal(`ACK:${i}`, 2500);
                    if (ack) {
                        log(`[TX] Получен ACK:${i}`);
                        delivered = true;
                        await sleep(100);
                    } else {
                        log(`[TX] Таймаут ACK:${i}, повтор...`);
                        await sleep(150);
                    }
                }

                if (!delivered) {
                    log(`[TX] СБОЙ: Пакет #${i + 1} не доставлен. Передача остановлена.`);
                    return;
                }
            }

            log(`[TX] УСПЕХ: Все пакеты доставлены!`);
        };

        function waitForSignal(type, timeoutMs) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (pendingSignal && pendingSignal.type === type) {
                        const res = pendingSignal;
                        clearInterval(checkInterval);
                        pendingSignal = null;
                        resolve(res);
                    }
                }, 25);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (pendingSignal && pendingSignal.type === type) {
                        const res = pendingSignal;
                        pendingSignal = null;
                        resolve(res);
                    } else {
                        resolve(null);
                    }
                }, timeoutMs);
            });
        }

        // ==========================================
        // 2. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            await startReceiver();
        };

        async function startReceiver() {
            if (isListening) return;
            initGGWave();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false }
                });
                mediaStream = context.createMediaStreamSource(stream);

                var bufferSize = 1024;
                recorder = context.createScriptProcessor ? 
                    context.createScriptProcessor(bufferSize, 1, 1) : 
                    context.createJavaScriptNode(bufferSize, 1, 1);

                const vuBar = document.getElementById('vuBar');

                recorder.onaudioprocess = function (e) {
                    var source = e.inputBuffer;
                    var pcmData = source.getChannelData(0);

                    // Индикатор уровня звука
                    let sum = 0;
                    for (let i = 0; i < pcmData.length; i++) {
                        sum += pcmData[i] * pcmData[i];
                    }
                    let rms = Math.sqrt(sum / pcmData.length);
                    if (vuBar) vuBar.style.width = Math.min(100, Math.floor(rms * 400)) + '%';

                    if (isTransmitting || Date.now() < deadTimeUntil) return;

                    var res = ggwave.decode(instance, convertTypedArray(new Float32Array(pcmData), Int8Array));

                    if (res && res.length > 0) {
                        const rawStr = new TextDecoder("utf-8").decode(res);
                        handleIncomingSignal(rawStr);
                    }
                };

                mediaStream.connect(recorder);
                recorder.connect(context.destination);

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";
                log("[RX] Микрофон активен.");
            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        }

        async function handleIncomingSignal(rawStr) {
            if (isTransmitting || Date.now() < deadTimeUntil) return;

            // 1. Приём ACK
            if (rawStr.includes("ACK:")) {
                const parts = rawStr.split("ACK:");
                pendingSignal = { type: `ACK:${parts[1].trim()}` };
                return;
            }

            // 2. Приём Пакета
            const jsonMatch = rawStr.match(/\{"i":.*\}/);
            if (jsonMatch) {
                try {
                    const pkt = JSON.parse(jsonMatch[0]);
                    if (pkt && typeof pkt.i === 'number') {
                        log(`[RX] Принят пакет #${pkt.i + 1}/${pkt.t}`);

                        receivedChunks[pkt.i] = pkt.d;
                        document.getElementById('pktStatus').innerText = `Принято пакетов: ${Object.keys(receivedChunks).length} / ${pkt.t}`;

                        // Отправляем ACK
                        await sleep(100);
                        await emitAudioSignal(`ACK:${pkt.i}`, 350);

                        // Сборка при полном получении
                        if (Object.keys(receivedChunks).length === pkt.t) {
                            let fullText = "";
                            for (let idx = 0; idx < pkt.t; idx++) {
                                fullText += receivedChunks[idx] || "";
                            }
                            document.getElementById('outputText').value = fullText;
                            log(`[RX] СБОРКА ЗАВЕРШЕНА: "${fullText}"`);
                        }
                    }
                } catch (e) {
                    log(`[RX] Битый кадр: ${e.message}`);
                }
            }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
