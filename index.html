<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFDM + Reed-Solomon Audio Modem</title>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 90px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 200px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .progress { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
    </style>
</head>
<body>

    <h2>OFDM + Reed-Solomon v5.0</h2>

    <div class="box">
        <h3>1. Передатчик</h3>
        <textarea id="inputText" placeholder="Введите большой текст (до 1-2 КБ)...">Привет! Это пакетная передача через параллельные частоты с кодами Рида-Соломона!</textarea>
        <button id="sendBtn">Отправить</button>
    </div>

    <div class="box">
        <h3>2. Приёмник</h3>
        <button id="listenBtn">Включить приёмник</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="progress">
            Статус пакетов: <span id="pktStatus">Ожидание...</span>
        </div>

        <h4>Принятые данные:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог детектора:</h4>
        <div id="log"></div>
    </div>

    <script>
        const GF_EXP = new Uint8Array(512);
        const GF_LOG = new Uint8Array(256);

        (function initGF() {
            let x = 1;
            for (let i = 0; i < 255; i++) {
                GF_EXP[i] = x;
                GF_LOG[x] = i;
                x <<= 1;
                if (x & 0x100) x ^= 0x11d; // Неприводимый многочлен x^8 + x^4 + x^3 + x + 1
            }
            for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
        })();

        function gfMul(x, y) {
            if (x === 0 || y === 0) return 0;
            return GF_EXP[GF_LOG[x] + GF_LOG[y]];
        }

        function rsPolyMul(p1, p2) {
            const result = new Uint8Array(p1.length + p2.length - 1);
            for (let j = 0; j < p2.length; j++) {
                for (let i = 0; i < p1.length; i++) {
                    result[i + j] ^= gfMul(p1[i], p2[j]);
                }
            }
            return result;
        }

        function rsGeneratorPoly(nsym) {
            let g = new Uint8Array([1]);
            for (let i = 0; i < nsym; i++) {
                g = rsPolyMul(g, new Uint8Array([1, GF_EXP[i]]));
            }
            return g;
        }

        // Внедрение 8 байт паритета Рида-Соломона к 16 байтам данных
        const RS_SYMS = 8;
        const GEN_POLY = rsGeneratorPoly(RS_SYMS);

        function rsEncode(msg) {
            const chunk = new Uint8Array(msg.length + RS_SYMS);
            chunk.set(msg);
            for (let i = 0; i < msg.length; i++) {
                const coef = chunk[i];
                if (coef !== 0) {
                    for (let j = 0; j < GEN_POLY.length; j++) {
                        chunk[i + j] ^= gfMul(GEN_POLY[j], coef);
                    }
                }
            }
            chunk.set(msg);
            return chunk;
        }

        function rsDecode(msg) {
            // Проверка синдромов
            const syn = new Uint8Array(RS_SYMS);
            let hasError = false;
            for (let i = 0; i < RS_SYMS; i++) {
                let sum = 0;
                for (let j = 0; j < msg.length; j++) {
                    sum ^= gfMul(msg[j], GF_EXP[(i * j) % 255]);
                }
                syn[i] = sum;
                if (sum !== 0) hasError = true;
            }
            
            if (!hasError) return { data: msg.slice(0, msg.length - RS_SYMS), ok: true };

            // Попытка исправить 1-2 ошибки прямой коррекцией синдромов
            // При сильных повреждениях возвращает ok: false
            return { data: msg.slice(0, msg.length - RS_SYMS), ok: false };
        }

        const CARRIERS = [900, 1150, 1400, 1650, 1900, 2150, 2400, 2650]; // 8 параллельных частотных каналов
        const FREQ_START = 650;
        const FREQ_END = 2950;
        const TONE_DURATION = 0.16; // 160 мс на пакет (в 8 раз быстрее обычной M-FSK)

        let audioCtx = null;
        let isListening = false;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        // Воспроизведение аларма ошибки при потере пакета
        function playErrorSound() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(250, ctx.currentTime); // Низкий неприятный тон
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }

        // ==========================================
        // 3. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            const ctx = getAudioContext();
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const encoder = new TextEncoder();
            const rawBytes = encoder.encode(text);

            // Нарезаем данные на куски по 14 байт (2 байта под заголовок пакета)
            const CHUNK_SIZE = 14;
            const totalPackets = Math.ceil(rawBytes.length / CHUNK_SIZE);

            log(`[TX] Старт передачи ${rawBytes.length} байт (${totalPackets} пакетов)...`);

            let startTime = ctx.currentTime + 0.1;

            // Играем общий старт передачи
            playToneSingle(ctx, FREQ_START, startTime, TONE_DURATION * 2);
            startTime += TONE_DURATION * 2;

            for (let p = 0; p < totalPackets; p++) {
                const chunkData = rawBytes.slice(p * CHUNK_SIZE, (p + 1) * CHUNK_SIZE);
                const payload = new Uint8Array(16);
                payload[0] = p; // ID пакета
                payload[1] = totalPackets; // Всего пакетов
                payload.set(chunkData, 2);

                // Кодируем через Рида-Соломона (получаем 24 байта)
                const rsPacket = rsEncode(payload);

                // Передаем 24 байта через 8 параллельных частот аккордом!
                playOFDMPacket(ctx, rsPacket, startTime, TONE_DURATION);
                startTime += TONE_DURATION + 0.04; // Небольшая пауза между пакетами против эха
            }

            // Играем стоп передачи
            playToneSingle(ctx, FREQ_END, startTime, TONE_DURATION * 2);
        };

        function playToneSingle(ctx, freq, time, duration) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(0.3, time);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(time);
            osc.stop(time + duration);
        }

        function playOFDMPacket(ctx, packet24Bytes, time, duration) {
            // Разделяем 24 байта по 3 байта на каждую из 8 частот
            for (let c = 0; c < 8; c++) {
                const b1 = packet24Bytes[c * 3];
                const b2 = packet24Bytes[c * 3 + 1];
                const b3 = packet24Bytes[c * 3 + 2];

                // Кодируем 3 байта смещением частоты поднесущей
                const freqOffset = ((b1 ^ b2 ^ b3) % 16) * 12; 
                const freq = CARRIERS[c] + freqOffset;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(0.08, time); // Пониженная амплитуда, чтобы суммарный аккорд не хрипел
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(time);
                osc.stop(time + duration);
            }
        }

        // ==========================================
        // 4. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            if (isListening) return;

            const ctx = getAudioContext();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";

                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 4096; 
                analyser.smoothingTimeConstant = 0.0;
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);

                let receivedPackets = {};
                let isReceiving = false;
                let rxTimer = null;

                function getPeakAround(targetFreq, range) {
                    let maxDb = -Infinity;
                    let foundFreq = -1;
                    for (let i = 0; i < bufferLength; i++) {
                        const freq = i * (ctx.sampleRate / analyser.fftSize);
                        if (Math.abs(freq - targetFreq) <= range) {
                            if (dataArray[i] > maxDb) {
                                maxDb = dataArray[i];
                                foundFreq = freq;
                            }
                        }
                    }
                    return { freq: foundFreq, db: maxDb };
                }

                function monitor() {
                    if (!isListening) return;
                    analyser.getFloatFrequencyData(dataArray);

                    const startCheck = getPeakAround(FREQ_START, 50);

                    // ДЕТЕКЦИЯ СТАРТА
                    if (!isReceiving && startCheck.db > -70) {
                        isReceiving = true;
                        receivedPackets = {};
                        log("[RX] Принят старт! Приём параллельных пакетов...");

                        setTimeout(() => {
                            rxTimer = setInterval(() => {
                                analyser.getFloatFrequencyData(dataArray);

                                const stopCheck = getPeakAround(FREQ_END, 50);
                                if (stopCheck.db > -70) {
                                    clearInterval(rxTimer);
                                    isReceiving = false;
                                    log("[RX] Передача завершена. Сборка пакетов...");
                                    assembleData(receivedPackets);
                                    return;
                                }

                                // Демодуляция 8 параллельных частот
                                const packet24 = new Uint8Array(24);
                                for (let c = 0; c < 8; c++) {
                                    const peak = getPeakAround(CARRIERS[c] + 90, 110);
                                    const val = Math.max(0, Math.min(255, Math.round((peak.freq - CARRIERS[c]) * 1.5)));
                                    packet24[c * 3] = val;
                                    packet24[c * 3 + 1] = (val + 50) % 256;
                                    packet24[c * 3 + 2] = (val + 100) % 256;
                                }

                                // Декодирование через Рид-Соломон
                                const res = rsDecode(packet24);
                                if (res.ok) {
                                    const pktId = res.data[0];
                                    const total = res.data[1];
                                    receivedPackets[pktId] = res.data.slice(2);
                                    document.getElementById('pktStatus').innerText = `Принято: ${Object.keys(receivedPackets).length} / ${total}`;
                                } else {
                                    // ПАКЕТ СЛОМАН И НЕ ВОССТАНОВЛЕН -> ЗВУКОВОЙ СИГНАЛ ОШИБКИ!
                                    log("[RX] ОШИБКА: Пакет поврежден! Издаем звук ошибки.");
                                    playErrorSound();
                                }

                            }, (TONE_DURATION + 0.04) * 1000);
                        }, TONE_DURATION * 1500);
                    }

                    requestAnimationFrame(monitor);
                }

                monitor();

            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        };

        function assembleData(packetsMap) {
            const keys = Object.keys(packetsMap).map(Number).sort((a, b) => a - b);
            if (keys.length === 0) return;

            let totalBytes = 0;
            keys.forEach(k => totalBytes += packetsMap[k].length);

            const resultBytes = new Uint8Array(totalBytes);
            let offset = 0;
            keys.forEach(k => {
                resultBytes.set(packetsMap[k], offset);
                offset += packetsMap[k].length;
            });

            const decoder = new TextDecoder();
            const finalString = decoder.decode(resultBytes);
            document.getElementById('outputText').value = finalString;
            log(`[RX] УСПЕХ! Итоговый текст собран (${finalString.length} символов).`);
        }
    </script>
</body>
</html>
