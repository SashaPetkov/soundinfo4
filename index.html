<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-FSK с Тактовой Синхронизацией</title>
    <style>
        body { font-family: monospace, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 160px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>M-FSK v3 (Clock Synchronized)</h2>

    <div class="box">
        <h3>1. Передатчик (TX)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Hello 123!</textarea>
        <button id="sendBtn">▶ Передать звук</button>
    </div>

    <div class="box">
        <h3>2. Приёмник (RX)</h3>
        <button id="listenBtn">🎙 Включить микрофон</button>
        <span id="listenStatus" class="status">Выключен</span>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог детектора:</h4>
        <div id="log"></div>
    </div>

    <script>
        // --- НАСТРОЙКИ МОДЕМА ---
        const BASE_FREQ = 1200;   
        const STEP_FREQ = 130;    
        const DATA_FREQS = Array.from({length: 16}, (_, i) => BASE_FREQ + i * STEP_FREQ);

        // Тактовые частоты (Синхронизация)
        const CLOCK_A = 3600; 
        const CLOCK_B = 4000; 

        const FREQ_START = 800;   
        const FREQ_END = 4500;    

        const TONE_DURATION = 0.10; // 100 мс на тон

        let audioCtx = null;
        let isListening = false;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        // Простая контрольная сумма (CRC8)
        function calcCRC(bytes) {
            let crc = 0;
            for (let b of bytes) crc = (crc + b) & 0xFF;
            return crc;
        }

        // ==========================================
        // 1. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            const ctx = getAudioContext();
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const encoder = new TextEncoder();
            const rawBytes = encoder.encode(text);
            
            // Добавляем контрольную сумму в конец
            const bytes = new Uint8Array(rawBytes.length + 1);
            bytes.set(rawBytes);
            bytes[rawBytes.length] = calcCRC(rawBytes);

            log(`[TX] Отправка... Байтов (с CRC): ${bytes.length}`);

            let startTime = ctx.currentTime + 0.1;

            // Воспроизведение старта
            playTone(ctx, FREQ_START, CLOCK_A, startTime, TONE_DURATION * 2);
            startTime += TONE_DURATION * 2;

            let clockState = false;

            for (let b of bytes) {
                const high = (b >> 4) & 0x0F;
                const low = b & 0x0F;

                // Передаем старший ниббл
                clockState = !clockState;
                playTone(ctx, DATA_FREQS[high], clockState ? CLOCK_A : CLOCK_B, startTime, TONE_DURATION);
                startTime += TONE_DURATION;

                // Передаем младший ниббл
                clockState = !clockState;
                playTone(ctx, DATA_FREQS[low], clockState ? CLOCK_A : CLOCK_B, startTime, TONE_DURATION);
                startTime += TONE_DURATION;
            }

            // Воспроизведение стопа
            playTone(ctx, FREQ_END, CLOCK_B, startTime, TONE_DURATION * 2);
        };

        function playTone(ctx, dataFreq, clockFreq, time, duration) {
            // Генератор данных
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.frequency.setValueAtTime(dataFreq, time);
            gain1.gain.setValueAtTime(0.2, time);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(time);
            osc1.stop(time + duration);

            // Генератор такта (Clock)
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.frequency.setValueAtTime(clockFreq, time);
            gain2.gain.setValueAtTime(0.15, time);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(time);
            osc2.stop(time + duration);
        }

        // ==========================================
        // 2. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            if (isListening) return;

            const ctx = getAudioContext();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";

                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 2048; 
                analyser.smoothingTimeConstant = 0.0; 
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);

                let rxNibbles = [];
                let receiving = false;
                let lastClockState = null;

                function processAudio() {
                    if (!isListening) return;

                    analyser.getFloatFrequencyData(dataArray);

                    // Вспомогательная функция поиска пика возле частоты
                    function getPeakFreqAround(targetFreq, range) {
                        let maxDb = -Infinity;
                        let foundFreq = -1;
                        for (let i = 0; i < bufferLength; i++) {
                            const freq = i * (ctx.sampleRate / analyser.fftSize);
                            if (Math.abs(freq - targetFreq) <= range) {
                                if (dataArray[i] > maxDb) {
                                    maxDb = dataArray[i];
                                    foundFreq = freq;
                                }
                            }
                        }
                        return { freq: foundFreq, db: maxDb };
                    }

                    // Ищем старт/стоп
                    const startCheck = getPeakFreqAround(FREQ_START, 50);
                    const stopCheck = getPeakFreqAround(FREQ_END, 50);

                    if (!receiving && startCheck.db > -70) {
                        receiving = true;
                        rxNibbles = [];
                        lastClockState = null;
                        log("[RX] Старт принят!");
                    } else if (receiving && stopCheck.db > -70) {
                        receiving = false;
                        log("[RX] Стоп принят!");
                        decodePacket(rxNibbles);
                    } else if (receiving) {
                        // Определяем текущий такт (Clock A или Clock B)
                        const clockA = getPeakFreqAround(CLOCK_A, 60);
                        const clockB = getPeakFreqAround(CLOCK_B, 60);

                        let currentClock = null;
                        if (clockA.db > -75 && clockA.db > clockB.db) currentClock = 'A';
                        else if (clockB.db > -75 && clockB.db > clockA.db) currentClock = 'B';

                        // СМЕНА ТАКТА = новый тон!
                        if (currentClock && currentClock !== lastClockState) {
                            lastClockState = currentClock;

                            // Считываем частоту данных
                            let maxDataDb = -Infinity;
                            let detectedNibble = -1;

                            for (let i = 0; i < 16; i++) {
                                const check = getPeakFreqAround(DATA_FREQS[i], 45);
                                if (check.db > maxDataDb) {
                                    maxDataDb = check.db;
                                    detectedNibble = i;
                                }
                            }

                            if (detectedNibble !== -1 && maxDataDb > -75) {
                                rxNibbles.push(detectedNibble);
                            }
                        }
                    }

                    requestAnimationFrame(processAudio);
                }

                processAudio();

            } catch (err) {
                alert("Ошибка микрофона: " + err);
            }
        };

        function decodePacket(nibbles) {
            log(`[RX] Всего принятых нибблов: ${nibbles.length}`);
            if (nibbles.length % 2 !== 0) nibbles.pop();

            const bytes = [];
            for (let i = 0; i < nibbles.length; i += 2) {
                bytes.push((nibbles[i] << 4) | nibbles[i + 1]);
            }

            if (bytes.length < 2) {
                log("[RX] Ошибка: Слишком короткий пакет.");
                return;
            }

            // Отделяем данные от CRC
            const receivedCRC = bytes.pop();
            const dataBytes = new Uint8Array(bytes);
            const expectedCRC = calcCRC(dataBytes);

            if (receivedCRC === expectedCRC) {
                const decoder = new TextDecoder();
                const resultText = decoder.decode(dataBytes);
                document.getElementById('outputText').value = resultText;
                log(`[RX] УСПЕХ! CRC совпал. Текст: "${resultText}"`);
            } else {
                log(`[RX] ОШИБКА CRC! Данные повреждены (Ожидалось ${expectedCRC}, получено ${receivedCRC}).`);
            }
        }
    </script>
</body>
</html>
