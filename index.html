<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardened Acoustic Modem (Regex Parser Fix)</title>
    <script src="ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea, input { width: 100%; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; font-family: monospace; }
        textarea { height: 80px; }
        input[type="text"] { margin-bottom: 10px; border-color: #0e639c; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 220px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .progress { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
        .cache-info { font-size: 11px; color: #ce9178; margin-top: 5px; }
        .key-box { background: #111; padding: 10px; border: 1px solid #555; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Защищенный Акустический Модем (Regex Parser Fix)</h2>

    <div class="key-box">
        <label>🔑 Общий секретный пароль (Pre-Shared Key):</label>
        <input type="text" id="secretPass" value="MypatsonSecret123">
    </div>

    <div class="box">
        <h3>1. Устройство А (Передатчик)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Секретный текст: Проверка устойчивости регулярных выражений к шуму в эфире!</textarea>
        <button id="sendBtn">▶ HMAC Auth и Отправка</button>
    </div>

    <div class="box">
        <h3>2. Устройство Б (Приёмник)</h3>
        <button id="listenBtn">🎙 Включить микрофон приёмника</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="progress">
            Статус сессии: <span id="pktStatus">Ожидание авторизации...</span>
        </div>

        <h4>Расшифрованный текст:</h4>
        <textarea id="outputText" readonly></textarea>
        <div class="cache-info" id="cacheInfo"></div>
        <button id="clearCacheBtn" style="background: #a12626; padding: 6px 10px; font-size: 11px;">Сбросить кэш</button>
    </div>

    <div class="box">
        <h4>Лог обмена:</h4>
        <div id="log"></div>
    </div>

    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;

        let context = null;
        let recorder = null;
        let mediaStream = null;

        let ggwave = null;
        let parameters = null;
        let instance = null;

        let isListening = false;
        let isTransmitting = false; 
        let deadTimeUntil = 0;      
        
        let rxState = "IDLE"; 
        
        let currentSourceNode = null;
        let pendingSignal = null;
        let receivedChunks = {};

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function convertTypedArray(src, type) {
            var buffer = new ArrayBuffer(src.byteLength);
            new src.constructor(buffer).set(src);
            return new type(buffer);
        }

        // ==========================================
        // КРИПТОГРАФИЯ (HMAC + AES-GCM via Web Crypto)
        // ==========================================

        async function computeHMAC(nonceHex, passphrase) {
            const enc = new TextEncoder();
            const key = await window.crypto.subtle.importKey(
                "raw", enc.encode(passphrase),
                { name: "HMAC", hash: "SHA-256" },
                false, ["sign"]
            );
            const signature = await window.crypto.subtle.sign("HMAC", key, enc.encode(nonceHex));
            return bytesToHex(new Uint8Array(signature).slice(0, 8));
        }

        async function deriveKey(passphrase, saltHex) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
            );
            return await window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: hexToBytes(saltHex), iterations: 10000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]
            );
        }

        async function encryptText(text, passphrase, saltHex) {
            const key = await deriveKey(passphrase, saltHex);
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text)
            );
            return bytesToHex(iv) + ":" + bytesToHex(new Uint8Array(ciphertext));
        }

        async function decryptText(encryptedHex, passphrase, saltHex) {
            try {
                const parts = encryptedHex.split(":");
                const key = await deriveKey(passphrase, saltHex);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: hexToBytes(parts[0]) }, key, hexToBytes(parts[1])
                );
                return new TextDecoder().decode(decrypted);
            } catch(e) {
                return null;
            }
        }

        function getRandomHex(len) {
            const arr = new Uint8Array(len);
            window.crypto.getRandomValues(arr);
            return bytesToHex(arr);
        }

        function bytesToHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            return bytes;
        }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ И АУДИОЯДРО
        // ==========================================
        window.onload = function() {
            log("[System] Загрузка ядра GGWave...");
            ggwave_factory().then(function(obj) {
                ggwave = obj;
                log("[System] Ядро готово. Crypto API подключен.");
                restoreFromCache();
            });
        };

        function initGGWave() {
            if (!context) {
                context = new AudioContext({ sampleRate: 48000 });
                parameters = ggwave.getDefaultParameters();
                parameters.sampleRateInp = context.sampleRate;
                parameters.sampleRateOut = context.sampleRate;
                instance = ggwave.init(parameters);
            }
            if (context.state === 'suspended') context.resume();
        }

        function emitAudioSignal(text, deadTimeMs = 800) {
            return new Promise((resolve) => {
                initGGWave();
                if (currentSourceNode) { try { currentSourceNode.stop(); } catch(e) {} }

                var waveform = ggwave.encode(instance, text, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);
                var buf = convertTypedArray(waveform, Float32Array);
                var buffer = context.createBuffer(1, buf.length, context.sampleRate);
                buffer.getChannelData(0).set(buf);

                currentSourceNode = context.createBufferSource();
                currentSourceNode.buffer = buffer;
                currentSourceNode.connect(context.destination);

                isTransmitting = true;

                currentSourceNode.onended = () => {
                    deadTimeUntil = Date.now() + deadTimeMs;
                    
                    setTimeout(() => {
                        isTransmitting = false;
                        resolve();
                    }, 100);
                };
                currentSourceNode.start(0);
            });
        }

        // ==========================================
        // КЭШ (LOCAL STORAGE)
        // ==========================================
        function saveToCache(chunksMap) {
            localStorage.setItem("sec_acoustic_chunks", JSON.stringify(chunksMap));
            updateCacheUI();
        }

        function restoreFromCache() {
            const cached = localStorage.getItem("sec_acoustic_chunks");
            if (cached) {
                receivedChunks = JSON.parse(cached);
                updateCacheUI();
            }
        }

        function updateCacheUI() {
            const count = Object.keys(receivedChunks).length;
            document.getElementById('cacheInfo').innerText = count > 0 ? `[Кэш] Пакетов в памяти: ${count}` : "";
        }

        document.getElementById('clearCacheBtn').onclick = () => {
            localStorage.removeItem("sec_acoustic_chunks");
            receivedChunks = {};
            rxState = "IDLE";
            document.getElementById('outputText').value = "";
            document.getElementById('cacheInfo').innerText = "[Кэш] Очищен.";
            document.getElementById('pktStatus').innerText = "Ожидание авторизации...";
            log("[Cache] Данные кэша сброшены.");
        };

        // ==========================================
        // 1. ЛОГИКА ПЕРЕДАТЧИКА (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            if (!ggwave) return;
            initGGWave();
            
            const text = document.getElementById('inputText').value;
            const pass = document.getElementById('secretPass').value;
            if (!text || !pass) { alert("Введите текст и секретный пароль!"); return; }

            if (!isListening) await startReceiver();

            rxState = "IDLE";

            // 1. AUTH CHALLENGE-RESPONSE (HMAC)
            const sessionSalt = getRandomHex(4);
            const challengeNonce = getRandomHex(4);
            const expectedHmac = await computeHMAC(challengeNonce, pass);

            log("[TX] --- Старт HMAC Handshake ---");

            let authOk = false;
            let attempts = 0;

            while (!authOk && attempts < 5) {
                attempts++;
                log(`[TX] Запрос AUTH (Nonce: ${challengeNonce}, попытка ${attempts})...`);
                
                await emitAudioSignal(`AUTH:${sessionSalt}:${challengeNonce}`, 50);

                const response = await waitForSignal("AUTH_RESP", 6000);
                if (response) {
                    if (response.payload === expectedHmac) {
                        authOk = true;
                        log("[TX] УСПЕХ! Рукопожатие подтверждено.");
                    } else {
                        log("[TX] ОШИБКА: Неверный HMAC от приёмника!");
                    }
                } else {
                    log("[TX] Таймаут ответа Handshake. Повтор...");
                    await sleep(600);
                }
            }

            if (!authOk) {
                log("[TX] ОТКЛОНЕНО: Приёмник не прошел аутентификацию.");
                return;
            }

            // 2. ПЕРЕДАЧА AES-GCM ПАКЕТОВ (CHUNK_SIZE = 12 для надежной передачи)
            const CHUNK_SIZE = 12;
            const totalPackets = Math.ceil(text.length / CHUNK_SIZE);

            log(`[TX] Передача зашифрованных пакетов: всего ${totalPackets} шт.`);

            for (let i = 0; i < totalPackets; i++) {
                const rawChunk = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const encryptedChunk = await encryptText(rawChunk, pass, sessionSalt);

                const payload = JSON.stringify({
                    id: i,
                    total: totalPackets,
                    salt: sessionSalt,
                    body: encryptedChunk
                });

                let delivered = false;
                let pktAttempts = 0;

                while (!delivered && pktAttempts < 5) {
                    pktAttempts++;
                    log(`[TX] Отправка AES-пакета #${i + 1}/${totalPackets} (Попытка ${pktAttempts})...`);
                    await emitAudioSignal(payload, 100);

                    const ack = await waitForSignal(`ACK:${i}`, 5000);
                    if (ack) {
                        log(`[TX] Получен ACK:${i}`);
                        delivered = true;
                        await sleep(400);
                    } else {
                        log(`[TX] Таймаут ACK:${i}. Повтор...`);
                        await sleep(500);
                    }
                }

                if (!delivered) {
                    log(`[TX] СБОЙ: Пакет #${i + 1} не доставлен.`);
                    return;
                }
            }

            log(`[TX] ВСЕ ПАКЕТЫ УСПЕШНО ЗАШИФРОВАНЫ И ДОСТАВЛЕНЫ!`);
        };

        function waitForSignal(type, timeoutMs) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (pendingSignal && pendingSignal.type === type) {
                        const res = pendingSignal;
                        clearInterval(checkInterval);
                        pendingSignal = null;
                        resolve(res);
                    }
                }, 50);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (pendingSignal && pendingSignal.type === type) {
                        const res = pendingSignal;
                        pendingSignal = null;
                        resolve(res);
                    } else {
                        resolve(null);
                    }
                }, timeoutMs);
            });
        }

        // ==========================================
        // 2. ЛОГИКА ПРИЁМНИКА (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            await startReceiver();
        };

        async function startReceiver() {
            if (isListening) return;
            initGGWave();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false }
                });
                mediaStream = context.createMediaStreamSource(stream);

                var bufferSize = 1024;
                recorder = context.createScriptProcessor ? 
                    context.createScriptProcessor(bufferSize, 1, 1) : 
                    context.createJavaScriptNode(bufferSize, 1, 1);

                recorder.onaudioprocess = function (e) {
                    if (isTransmitting || Date.now() < deadTimeUntil) return;

                    var source = e.inputBuffer;
                    var res = ggwave.decode(instance, convertTypedArray(new Float32Array(source.getChannelData(0)), Int8Array));

                    if (res && res.length > 0) {
                        const rawStr = new TextDecoder("utf-8").decode(res);
                        handleIncomingSignal(rawStr);
                    }
                };

                mediaStream.connect(recorder);
                recorder.connect(context.destination);

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";
                log("[RX] Микрофон активен.");
            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        }

        async function handleIncomingSignal(rawStr) {
            if (isTransmitting || Date.now() < deadTimeUntil) return;

            const pass = document.getElementById('secretPass').value;

            // 1. Приём AUTH Challenge
            if (rawStr.includes("AUTH:")) {
                if (rxState !== "IDLE") return;

                const parts = rawStr.split(":");
                const nonceHex = parts[2];

                log(`[RX] Пойман AUTH! Вычисляем HMAC...`);
                const hmacRes = await computeHMAC(nonceHex, pass);

                rxState = "WAIT_DATA"; 

                await sleep(400);
                await emitAudioSignal(`SA:${hmacRes}`, 1200);
                
                log(`[RX] HMAC отправлен. Режим переключен в ожидание данных.`);
                return;
            }

            // 2. Ответ на Handshake (для передатчика)
            if (rawStr.includes("SA:")) {
                const parts = rawStr.split("SA:");
                pendingSignal = { type: "AUTH_RESP", payload: parts[1] };
                return;
            }

            // 3. Подтверждение ACK (для передатчика)
            if (rawStr.includes("ACK:")) {
                const parts = rawStr.split("ACK:");
                pendingSignal = { type: `ACK:${parts[1]}` };
                return;
            }

            // 4. Зашифрованный пакет данных (ПАРСИНГ ЧЕРЕЗ REGEX)
            const jsonMatch = rawStr.match(/\{"id":.*\}/);
            if (jsonMatch) {
                try {
                    const pkt = JSON.parse(jsonMatch[0]);
                    if (pkt && typeof pkt.id === 'number') {
                        log(`[RX] Принят зашифрованный пакет #${pkt.id + 1}/${pkt.total}!`);

                        const decryptedBody = await decryptText(pkt.body, pass, pkt.salt);

                        if (decryptedBody !== null) {
                            receivedChunks[pkt.id] = decryptedBody;
                            saveToCache(receivedChunks);

                            document.getElementById('pktStatus').innerText = `Принято: ${Object.keys(receivedChunks).length} / ${pkt.total}`;

                            await sleep(250);
                            await emitAudioSignal(`ACK:${pkt.id}`, 800);

                            if (Object.keys(receivedChunks).length === pkt.total) {
                                assembleFinalData(receivedChunks, pkt.total);
                                rxState = "IDLE";
                                log("[RX] УСПЕХ! Все пакеты приняты и расшифрованы.");
                            }
                        } else {
                            log(`[RX] ОШИБКА ДЕКРИПТА: Неверный Pre-Shared Key!`);
                        }
                    }
                } catch (e) {
                    log(`[RX] Ошибка битого JSON: ${e.message}`);
                }
            }
        }

        function assembleFinalData(chunksMap, total) {
            let fullText = "";
            for (let i = 0; i < total; i++) {
                fullText += chunksMap[i] || "";
            }
            document.getElementById('outputText').value = fullText;
            log(`[RX] СБОРКА ЗАВЕРШЕНА! Восстановлен текст: ${fullText.length} симв.`);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
