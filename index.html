<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Modem (Handshake + Cached Protocol)</title>
    <!-- Подключаем локальный монолитный ggwave.js -->
    <script src="ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 220px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .progress { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
        .cache-info { font-size: 11px; color: #ce9178; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>Акустический Модем (Handshake + Cache + ACK)</h2>

    <div class="box">
        <h3>1. Устройство А (Передатчик)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Привет! Это проверка двустороннего рукопожатия (Handshake) с кэшированием состояния передачи в localStorage.</textarea>
        <button id="sendBtn">▶ Начать Handshake и Отправить</button>
    </div>

    <div class="box">
        <h3>2. Устройство Б (Приёмник)</h3>
        <button id="listenBtn">🎙 Включить микрофон приёмника</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="progress">
            Статус сессии: <span id="pktStatus">Ожидание SYN...</span>
        </div>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
        <div class="cache-info" id="cacheInfo"></div>
        <button id="clearCacheBtn" style="background: #a12626; padding: 6px 10px; font-size: 11px;">Сбросить кэш сессии</button>
    </div>

    <div class="box">
        <h4>Лог обмена:</h4>
        <div id="log"></div>
    </div>

    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;

        let context = null;
        let recorder = null;
        let mediaStream = null;

        let ggwave = null;
        let parameters = null;
        let instance = null;

        let isListening = false;
        let isTransmitting = false; // Глушим микрофон во время генерации звука
        let currentSourceNode = null;

        let pendingSignal = null; // Хранит ожидаемый ответ (SYN-ACK или ACK:id)
        let receivedChunks = {};

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function convertTypedArray(src, type) {
            var buffer = new ArrayBuffer(src.byteLength);
            new src.constructor(buffer).set(src);
            return new type(buffer);
        }

        window.onload = function() {
            log("[System] Загрузка встроенного ядра GGWave...");
            
            if (typeof ggwave_factory === 'undefined') {
                log("[Error] Ошибка: ggwave.js не найден!");
                return;
            }

            ggwave_factory().then(function(obj) {
                ggwave = obj;
                log("[System] Ядро GGWave запущено.");
                restoreFromCache();
            }).catch(err => {
                log("[Error] Ошибка инициализации ядра: " + err);
            });
        };

        function initGGWave() {
            if (!context) {
                context = new AudioContext({ sampleRate: 48000 });

                parameters = ggwave.getDefaultParameters();
                parameters.sampleRateInp = context.sampleRate;
                parameters.sampleRateOut = context.sampleRate;
                instance = ggwave.init(parameters);
                
                log("[System] AudioContext и экземпляр GGWave созданы.");
            }
            if (context.state === 'suspended') {
                context.resume();
            }
        }

        // Излучение сигнала с остановкой предыдущих хвостов звука
        function emitAudioSignal(text) {
            initGGWave();

            if (currentSourceNode) {
                try { currentSourceNode.stop(); } catch(e) {}
            }

            var waveform = ggwave.encode(instance, text, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);

            var buf = convertTypedArray(waveform, Float32Array);
            var buffer = context.createBuffer(1, buf.length, context.sampleRate);
            buffer.getChannelData(0).set(buf);

            currentSourceNode = context.createBufferSource();
            currentSourceNode.buffer = buffer;
            currentSourceNode.connect(context.destination);

            isTransmitting = true;

            currentSourceNode.onended = () => {
                // Небольшая пауза после воспроизведения для затухания эха
                setTimeout(() => {
                    isTransmitting = false;
                }, 120);
            };

            currentSourceNode.start(0);
        }

        // ==========================================
        // 1. КЭШИРОВАНИЕ (LOCAL STORAGE)
        // ==========================================
        function saveToCache(chunks, totalText = "") {
            localStorage.setItem("acoustic_chunks", JSON.stringify(chunks));
            if (totalText) localStorage.setItem("acoustic_full_text", totalText);
            updateCacheUI();
        }

        function restoreFromCache() {
            const cachedChunks = localStorage.getItem("acoustic_chunks");
            const cachedText = localStorage.getItem("acoustic_full_text");

            if (cachedChunks) {
                receivedChunks = JSON.parse(cachedChunks);
                const count = Object.keys(receivedChunks).length;
                document.getElementById('cacheInfo').innerText = `[Кэш] Восстановлено пакетов: ${count}`;
            }
            if (cachedText) {
                document.getElementById('outputText').value = cachedText;
            }
        }

        document.getElementById('clearCacheBtn').onclick = () => {
            localStorage.removeItem("acoustic_chunks");
            localStorage.removeItem("acoustic_full_text");
            receivedChunks = {};
            document.getElementById('outputText').value = "";
            document.getElementById('cacheInfo').innerText = "[Кэш] Очищен.";
            log("[Cache] Данные локального кэша сброшены.");
        };

        // ==========================================
        // 2. ЛОГИКА ПЕРЕДАТЧИКА (TX WITH HANDSHAKE)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            if (!ggwave) { alert("Ядро не инициализировано!"); return; }
            initGGWave();
            
            const text = document.getElementById('inputText').value;
            if (!text) return;

            if (!isListening) await startReceiver();

            // 1. Этап Handshake (Установка соединения)
            log("[TX] --- Начинаем Handshake (Отправка SYN) ---");
            let handshakeOk = false;
            let synAttempts = 0;

            while (!handshakeOk && synAttempts < 5) {
                synAttempts++;
                log(`[TX] Запрос связи SYN (Попытка ${synAttempts})...`);
                emitAudioSignal("SYN");

                const synAck = await waitForSignal("SYN-ACK", 3000);
                if (synAck) {
                    handshakeOk = true;
                    log("[TX] Рукопожатие успешно! Получен SYN-ACK от приёмника.");
                } else {
                    await sleep(500);
                }
            }

            if (!handshakeOk) {
                log("[TX] ОШИБКА: Приёмник не ответил на Handshake (SYN-ACK не получен).");
                return;
            }

            // 2. Этап передачи пакетов
            const CHUNK_SIZE = 30;
            const totalPackets = Math.ceil(text.length / CHUNK_SIZE);

            log(`[TX] Передача пакетов: всего ${totalPackets} шт.`);

            for (let i = 0; i < totalPackets; i++) {
                const chunkText = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                
                const payload = JSON.stringify({
                    id: i,
                    total: totalPackets,
                    body: chunkText
                });

                let delivered = false;
                let attempts = 0;

                while (!delivered && attempts < 5) {
                    attempts++;
                    log(`[TX] Пакетик #${i} (Попытка ${attempts})...`);
                    
                    emitAudioSignal(payload);

                    const ackReceived = await waitForSignal(`ACK:${i}`, 3000);

                    if (ackReceived) {
                        log(`[TX] Успешно! Подтвержден ACK:${i}`);
                        delivered = true;
                        await sleep(350);
                    } else {
                        log(`[TX] Таймаут ACK:${i}. Повторная отправка...`);
                        await sleep(500);
                    }
                }

                if (!delivered) {
                    log(`[TX] ОШИБКА: Передача сорвана на пакете #${i}.`);
                    return;
                }
            }

            log(`[TX] ВСЕ ДАННЫЕ УСПЕШНО ПЕРЕДАНЫ И ПОДТВЕРЖДЕНЫ!`);
        };

        function waitForSignal(expectedSignal, timeoutMs) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (pendingSignal === expectedSignal) {
                        clearInterval(checkInterval);
                        pendingSignal = null;
                        resolve(true);
                    }
                }, 50);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (pendingSignal === expectedSignal) {
                        pendingSignal = null;
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                }, timeoutMs);
            });
        }

        // ==========================================
        // 3. ЛОГИКА ПРИЁМНИКА (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            await startReceiver();
        };

        async function startReceiver() {
            if (isListening) return;
            initGGWave();

            let constraints = {
                audio: {
                    echoCancellation: false,
                    autoGainControl: false,
                    noiseSuppression: false,
                    suppressLocalAudioPlayback: false
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = context.createMediaStreamSource(stream);

                var bufferSize = 1024;
                if (context.createScriptProcessor) {
                    recorder = context.createScriptProcessor(bufferSize, 1, 1);
                } else {
                    recorder = context.createJavaScriptNode(bufferSize, 1, 1);
                }

                recorder.onaudioprocess = function (e) {
                    if (isTransmitting) return; // Игнорируем собственное эхо

                    var source = e.inputBuffer;
                    var res = ggwave.decode(instance, convertTypedArray(new Float32Array(source.getChannelData(0)), Int8Array));

                    if (res && res.length > 0) {
                        const rawStr = new TextDecoder("utf-8").decode(res);
                        handleIncomingSignal(rawStr);
                    }
                };

                mediaStream.connect(recorder);
                recorder.connect(context.destination);

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";
                log("[RX] Микрофон активирован.");

            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        }

        function handleIncomingSignal(rawStr) {
            // Реакция на служебные сигналы (SYN / SYN-ACK / ACK)
            if (rawStr === "SYN") {
                log("[RX] Пойман сигнал SYN. Отправляем ответ SYN-ACK...");
                setTimeout(() => { emitAudioSignal("SYN-ACK"); }, 250);
                return;
            }

            if (rawStr === "SYN-ACK" || rawStr.startsWith("ACK:")) {
                log(`[RX/TX Listener] Сигнал подтверждения: ${rawStr}`);
                pendingSignal = rawStr;
                return;
            }

            // Обработка пакета данных
            try {
                const pkt = JSON.parse(rawStr);
                if (pkt && typeof pkt.id === 'number') {
                    log(`[RX] Принят пакет #${pkt.id}/${pkt.total}. Отправляем ACK:${pkt.id}...`);
                    
                    receivedChunks[pkt.id] = pkt.body;
                    saveToCache(receivedChunks);

                    document.getElementById('pktStatus').innerText = `Принято: ${Object.keys(receivedChunks).length} / ${pkt.total}`;

                    setTimeout(() => {
                        emitAudioSignal(`ACK:${pkt.id}`);
                    }, 250);

                    if (Object.keys(receivedChunks).length === pkt.total) {
                        assembleFinalData(receivedChunks, pkt.total);
                    }
                }
            } catch (e) {}
        }

        function assembleFinalData(chunksMap, total) {
            let fullText = "";
            for (let i = 0; i < total; i++) {
                fullText += chunksMap[i] || "";
            }
            document.getElementById('outputText').value = fullText;
            saveToCache(chunksMap, fullText);
            log(`[RX] ГОТОВО! Собрано символов: ${fullText.length}. Данные сохранены в кэш.`);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
