<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Modem</title>
    <script src="ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 750px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 10px 16px; margin: 6px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 13px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 12px; margin-bottom: 15px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 180px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 8px; }
        .progress { font-size: 12px; margin-top: 8px; color: #dcdcaa; }
        .cache-info { font-size: 11px; color: #ce9178; margin-top: 4px; }
    </style>
</head>
<body>

    <h2>Акустический Модем</h2>

    <div class="box">
        <h3>Передатчик (TX)</h3>
        <textarea id="inputText" placeholder="Текст для передачи...">Привет! Это тестовое сообщение.</textarea>
        <button id="sendBtn">Отправить</button>
    </div>

    <div class="box">
        <h3>Приёмник (RX)</h3>
        <button id="listenBtn">Включить микрофон</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="progress">
            Статус: <span id="pktStatus">Ожидание SYN...</span>
        </div>

        <textarea id="outputText" readonly placeholder="Полученный текст..."></textarea>
        <div class="cache-info" id="cacheInfo"></div>
        <button id="clearCacheBtn" style="background: #a12626; padding: 4px 8px; font-size: 11px;">Очистить кэш</button>
    </div>

    <div class="box">
        <h4>Лог:</h4>
        <div id="log"></div>
    </div>

    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;

        let context = null;
        let recorder = null;
        let mediaStream = null;

        let ggwave = null;
        let parameters = null;
        let instance = null;

        let isListening = false;
        let isTransmitting = false;
        let currentSourceNode = null;

        let pendingSignal = null;
        let receivedChunks = {};

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function convertTypedArray(src, type) {
            var buffer = new ArrayBuffer(src.byteLength);
            new src.constructor(buffer).set(src);
            return new type(buffer);
        }

        window.onload = function() {
            if (typeof ggwave_factory === 'undefined') {
                log("[Error] Ошибка: ggwave.js не найден!");
                return;
            }

            ggwave_factory().then(function(obj) {
                ggwave = obj;
                log("[System] GGWave готов.");
                restoreFromCache();
            }).catch(err => {
                log("[Error] Ошибка ядра: " + err);
            });
        };

        function initGGWave() {
            if (!context) {
                context = new AudioContext({ sampleRate: 48000 });
                parameters = ggwave.getDefaultParameters();
                parameters.sampleRateInp = context.sampleRate;
                parameters.sampleRateOut = context.sampleRate;
                instance = ggwave.init(parameters);
            }
            if (context.state === 'suspended') {
                context.resume();
            }
        }

        function emitAudioSignal(text) {
            return new Promise((resolve) => {
                initGGWave();

                if (currentSourceNode) {
                    try { currentSourceNode.stop(); } catch(e) {}
                }

                var waveform = ggwave.encode(instance, text, ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10);
                var buf = convertTypedArray(waveform, Float32Array);
                var buffer = context.createBuffer(1, buf.length, context.sampleRate);
                buffer.getChannelData(0).set(buf);

                currentSourceNode = context.createBufferSource();
                currentSourceNode.buffer = buffer;
                currentSourceNode.connect(context.destination);

                isTransmitting = true;

                currentSourceNode.onended = () => {
                    setTimeout(() => {
                        isTransmitting = false;
                        resolve();
                    }, 150);
                };

                currentSourceNode.start(0);
            });
        }

        function saveToCache(chunks, totalText = "") {
            localStorage.setItem("acoustic_chunks", JSON.stringify(chunks));
            if (totalText) localStorage.setItem("acoustic_full_text", totalText);
            updateCacheUI();
        }

        function restoreFromCache() {
            const cachedChunks = localStorage.getItem("acoustic_chunks");
            const cachedText = localStorage.getItem("acoustic_full_text");

            if (cachedChunks) {
                receivedChunks = JSON.parse(cachedChunks);
                updateCacheUI();
            }
            if (cachedText) {
                document.getElementById('outputText').value = cachedText;
            }
        }

        function updateCacheUI() {
            const count = Object.keys(receivedChunks).length;
            document.getElementById('cacheInfo').innerText = count > 0 ? `Кэш: ${count} пакетов` : "";
        }

        document.getElementById('clearCacheBtn').onclick = () => {
            localStorage.removeItem("acoustic_chunks");
            localStorage.removeItem("acoustic_full_text");
            receivedChunks = {};
            document.getElementById('outputText').value = "";
            document.getElementById('cacheInfo').innerText = "Кэш очищен";
            document.getElementById('pktStatus').innerText = "Ожидание SYN...";
            log("[Cache] Очищено.");
        };

        document.getElementById('sendBtn').onclick = async () => {
            if (!ggwave) { alert("Ядро не инициализировано!"); return; }
            initGGWave();

            const text = document.getElementById('inputText').value;
            if (!text) return;

            if (!isListening) await startReceiver();

            log("[TX] Старт Handshake (SYN)...");
            let handshakeOk = false;
            let synAttempts = 0;

            while (!handshakeOk && synAttempts < 5) {
                synAttempts++;
                await emitAudioSignal("SYN");
                const synAck = await waitForSignal("SYN-ACK", 5000);
                if (synAck) {
                    handshakeOk = true;
                    log("[TX] Соединение установлено.");
                } else {
                    log(`[TX] SYN-ACK таймаут...`);
                    await sleep(300);
                }
            }

            if (!handshakeOk) {
                log("[TX] Ошибка: нет ответа на SYN.");
                return;
            }

            const CHUNK_SIZE = 25;
            const totalPackets = Math.ceil(text.length / CHUNK_SIZE);

            log(`[TX] Передача: ${totalPackets} пакетов.`);

            for (let i = 0; i < totalPackets; i++) {
                const chunkText = text.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const payload = JSON.stringify({
                    id: i,
                    total: totalPackets,
                    body: chunkText
                });

                let delivered = false;
                let attempts = 0;

                while (!delivered && attempts < 5) {
                    attempts++;
                    log(`[TX] Пакет #${i} (попытка ${attempts})...`);
                    await emitAudioSignal(payload);

                    const ackReceived = await waitForSignal(`ACK:${i}`, 5000);

                    if (ackReceived) {
                        log(`[TX] ACK:${i} получен.`);
                        delivered = true;
                        await sleep(300);
                    } else {
                        log(`[TX] ACK:${i} таймаут...`);
                        await sleep(400);
                    }
                }

                if (!delivered) {
                    log(`[TX] Ошибка передачи на пакете #${i}.`);
                    return;
                }
            }

            log(`[TX] Передача завершена!`);
        };

        function waitForSignal(expectedSignal, timeoutMs) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (pendingSignal === expectedSignal) {
                        clearInterval(checkInterval);
                        pendingSignal = null;
                        resolve(true);
                    }
                }, 50);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (pendingSignal === expectedSignal) {
                        pendingSignal = null;
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                }, timeoutMs);
            });
        }

        document.getElementById('listenBtn').onclick = async () => {
            await startReceiver();
        };

        async function startReceiver() {
            if (isListening) return;
            initGGWave();

            let constraints = {
                audio: {
                    echoCancellation: false,
                    autoGainControl: false,
                    noiseSuppression: false,
                    suppressLocalAudioPlayback: false
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = context.createMediaStreamSource(stream);

                var bufferSize = 1024;
                if (context.createScriptProcessor) {
                    recorder = context.createScriptProcessor(bufferSize, 1, 1);
                } else {
                    recorder = context.createJavaScriptNode(bufferSize, 1, 1);
                }

                recorder.onaudioprocess = function (e) {
                    if (isTransmitting) return;

                    var source = e.inputBuffer;
                    var res = ggwave.decode(instance, convertTypedArray(new Float32Array(source.getChannelData(0)), Int8Array));

                    if (res && res.length > 0) {
                        const rawStr = new TextDecoder("utf-8").decode(res);
                        handleIncomingSignal(rawStr);
                    }
                };

                mediaStream.connect(recorder);
                recorder.connect(context.destination);

                isListening = true;
                document.getElementById('listenStatus').innerText = "Активен";
                document.getElementById('listenStatus').style.color = "#4ec9b0";
                log("[RX] Микрофон включен.");

            } catch (err) {
                alert("Ошибка микрофона: " + err);
            }
        }

        function handleIncomingSignal(rawStr) {
            if (rawStr === "SYN") {
                log("[RX] SYN получен -> SYN-ACK");
                setTimeout(() => { emitAudioSignal("SYN-ACK"); }, 200);
                return;
            }

            if (rawStr === "SYN-ACK" || rawStr.startsWith("ACK:")) {
                log(`[ACK] ${rawStr}`);
                pendingSignal = rawStr;
                return;
            }

            try {
                const pkt = JSON.parse(rawStr);
                if (pkt && typeof pkt.id === 'number') {
                    log(`[RX] Пакет #${pkt.id}/${pkt.total}`);
                    
                    receivedChunks[pkt.id] = pkt.body;
                    saveToCache(receivedChunks);

                    document.getElementById('pktStatus').innerText = `${Object.keys(receivedChunks).length} / ${pkt.total}`;

                    setTimeout(() => {
                        emitAudioSignal(`ACK:${pkt.id}`);
                    }, 200);

                    if (Object.keys(receivedChunks).length === pkt.total) {
                        assembleFinalData(receivedChunks, pkt.total);
                    }
                }
            } catch (e) {}
        }

        function assembleFinalData(chunksMap, total) {
            let fullText = "";
            for (let i = 0; i < total; i++) {
                fullText += chunksMap[i] || "";
            }
            document.getElementById('outputText').value = fullText;
            saveToCache(chunksMap, fullText);
            log(`[RX] Готово! Длина: ${fullText.length}`);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
