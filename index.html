<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайминговый M-FSK Модем</title>
    <style>
        body { font-family: monospace, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 180px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
        .monitor { background: #111; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: #dcdcaa; }
    </style>
</head>
<body>

    <h2>M-FSK v4 (Time-Window Synchronized)</h2>

    <div class="box">
        <h3>1. Передатчик (TX)</h3>
        <textarea id="inputText" placeholder="Введите текст...">Test 123!</textarea>
        <button id="sendBtn">▶ Передать звук</button>
    </div>

    <div class="box">
        <h3>2. Приёмник (RX)</h3>
        <button id="listenBtn">🎙 Включить микрофон</button>
        <span id="listenStatus" class="status">Выключен</span>

        <div class="monitor">
            Громкость: <span id="dbVal">-100</span> dB | Частота: <span id="freqVal">0</span> Гц
        </div>

        <h4>Полученный текст:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог детектора:</h4>
        <div id="log"></div>
    </div>

    <script>
        // --- НАСТРОЙКИ МОДЕМА ---
        const BASE_FREQ = 1000;   
        const STEP_FREQ = 100;    
        const DATA_FREQS = Array.from({length: 16}, (_, i) => BASE_FREQ + i * STEP_FREQ); // 1000..2500 Гц

        const FREQ_START = 700;   
        const FREQ_END = 2800;    

        const TONE_DURATION = 0.15; // 150 мс на один тон (железобетонная длительность)

        let audioCtx = null;
        let isListening = false;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        function calcCRC(bytes) {
            let crc = 0;
            for (let b of bytes) crc = (crc + b) & 0xFF;
            return crc;
        }

        // ==========================================
        // 1. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = async () => {
            const ctx = getAudioContext();
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const encoder = new TextEncoder();
            const rawBytes = encoder.encode(text);
            
            const bytes = new Uint8Array(rawBytes.length + 1);
            bytes.set(rawBytes);
            bytes[rawBytes.length] = calcCRC(rawBytes);

            log(`[TX] Отправка... Данных: ${rawBytes.length} б, итого с CRC: ${bytes.length} б.`);

            let startTime = ctx.currentTime + 0.1;

            // Стартовый маркер (играем двойной интервал)
            playTone(ctx, FREQ_START, startTime, TONE_DURATION * 2);
            startTime += TONE_DURATION * 2;

            for (let b of bytes) {
                const high = (b >> 4) & 0x0F;
                const low = b & 0x0F;

                playTone(ctx, DATA_FREQS[high], startTime, TONE_DURATION);
                startTime += TONE_DURATION;

                playTone(ctx, DATA_FREQS[low], startTime, TONE_DURATION);
                startTime += TONE_DURATION;
            }

            // Стоповый маркер
            playTone(ctx, FREQ_END, startTime, TONE_DURATION * 2);
        };

        function playTone(ctx, freq, time, duration) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.frequency.setValueAtTime(freq, time);
            osc.type = 'sine';

            // Колоколообразная огибающая против щелчков
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.3, time + 0.01);
            gain.gain.setValueAtTime(0.3, time + duration - 0.01);
            gain.gain.linearRampToValueAtTime(0, time + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(time);
            osc.stop(time + duration);
        }

        // ==========================================
        // 2. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            if (isListening) return;

            const ctx = getAudioContext();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";

                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 2048; 
                analyser.smoothingTimeConstant = 0.0; 
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);

                let isReceiving = false;
                let sampleInterval = null;
                let rxNibbles = [];

                function getPeak() {
                    analyser.getFloatFrequencyData(dataArray);
                    let maxDb = -Infinity;
                    let maxIndex = -1;

                    for (let i = 0; i < bufferLength; i++) {
                        if (dataArray[i] > maxDb) {
                            maxDb = dataArray[i];
                            maxIndex = i;
                        }
                    }

                    const freq = maxIndex * (ctx.sampleRate / analyser.fftSize);
                    return { freq, db: maxDb };
                }

                function monitor() {
                    if (!isListening) return;
                    const peak = getPeak();

                    document.getElementById('dbVal').innerText = Math.round(peak.db);
                    document.getElementById('freqVal').innerText = Math.round(peak.freq);

                    // Детекция СТАРТА
                    if (!isReceiving && peak.db > -75 && Math.abs(peak.freq - FREQ_START) < 60) {
                        isReceiving = true;
                        rxNibbles = [];
                        log("[RX] Обнаружен старт! Запуск таймера чтения...");

                        // Ждем завершения стартового тона (попадаем в середину первого тона данных)
                        setTimeout(() => {
                            // Запускаем циклическое чтение строго каждые 150 мс
                            sampleInterval = setInterval(() => {
                                const currentPeak = getPeak();

                                // Проверяем СТОП
                                if (currentPeak.db > -75 && Math.abs(currentPeak.freq - FREQ_END) < 60) {
                                    clearInterval(sampleInterval);
                                    isReceiving = false;
                                    log("[RX] Принят стоп!");
                                    decodePacket(rxNibbles);
                                    return;
                                }

                                // Ищем ближайший ниббл из 16 частот
                                let bestNibble = -1;
                                let minDiff = Infinity;

                                for (let i = 0; i < 16; i++) {
                                    const diff = Math.abs(currentPeak.freq - DATA_FREQS[i]);
                                    if (diff < minDiff && diff < 50) {
                                        minDiff = diff;
                                        bestNibble = i;
                                    }
                                }

                                if (bestNibble !== -1 && currentPeak.db > -80) {
                                    rxNibbles.push(bestNibble);
                                } else {
                                    // Если звук пропал или исказился
                                    rxNibbles.push(0); 
                                }

                            }, TONE_DURATION * 1000);

                        }, TONE_DURATION * 1500); // Сдвиг на середину первой посылки
                    }

                    requestAnimationFrame(monitor);
                }

                monitor();

            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        };

        function decodePacket(nibbles) {
            log(`[RX] Считано символов: ${nibbles.length}`);
            
            if (nibbles.length < 4) {
                log("[RX] Ошибка: Слишком короткий пакет.");
                return;
            }

            if (nibbles.length % 2 !== 0) nibbles.pop();

            const bytes = [];
            for (let i = 0; i < nibbles.length; i += 2) {
                bytes.push((nibbles[i] << 4) | nibbles[i + 1]);
            }

            const receivedCRC = bytes.pop();
            const dataBytes = new Uint8Array(bytes);
            const expectedCRC = calcCRC(dataBytes);

            if (receivedCRC === expectedCRC) {
                const decoder = new TextDecoder();
                const resultText = decoder.decode(dataBytes);
                document.getElementById('outputText').value = resultText;
                log(`[RX] УСПЕХ! Текст: "${resultText}"`);
            } else {
                log(`[RX] Ошибка CRC! (Ожидалось: ${expectedCRC}, Принято: ${receivedCRC}).`);
            }
        }
    </script>
</body>
</html>
