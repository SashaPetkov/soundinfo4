<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Data Link (GGWave)</title>
    <!-- Подключаем легкую библиотеку GGWave напрямую из CDN -->
    <script src="https://ggwave.js.org/ggwave.js"></script>
    <style>
        body { font-family: monospace, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 90px; background: #252526; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        button { padding: 12px 18px; margin: 8px 0; background: #0e639c; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        button:hover { background: #1177bb; }
        .box { border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 20px; border-radius: 6px; background: #252526; }
        #log { background: #111; padding: 10px; height: 180px; overflow-y: scroll; color: #4ec9b0; border: 1px solid #333; font-size: 12px; border-radius: 4px; }
        .status { font-weight: bold; color: #ce9178; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>Звуковой Модем (на базе GGWave WASM)</h2>

    <div class="box">
        <h3>1. Передатчик (TX)</h3>
        <textarea id="inputText" placeholder="Введите любой текст или данные...">Привет, брат! Теперь всё работает мгновенно и без ошибок CRC!</textarea>
        <button id="sendBtn">▶ Отправить через звук</button>
    </div>

    <div class="box">
        <h3>2. Приёмник (RX)</h3>
        <button id="listenBtn">🎙 Включить микрофон</button>
        <span id="listenStatus" class="status">Выключен</span>

        <h4>Принятый текст:</h4>
        <textarea id="outputText" readonly></textarea>
    </div>

    <div class="box">
        <h4>Лог детектора:</h4>
        <div id="log"></div>
    </div>

    <script>
        let ggwaveInstance = null;
        let audioCtx = null;
        let isListening = false;

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + '<br>';
            l.scrollTop = l.scrollHeight;
        }

        // Инициализация библиотечного движка
        window.onload = async () => {
            log("Инициализация ядра GGWave (WASM)...");
            ggwaveFactory().then((instance) => {
                ggwaveInstance = instance;
                log("Движок готов к работе!");
            });
        };

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        // ==========================================
        // 1. ПЕРЕДАТЧИК (TX)
        // ==========================================
        document.getElementById('sendBtn').onclick = () => {
            if (!ggwaveInstance) { alert("Ядро ещё загружается..."); return; }
            const ctx = getAudioContext();
            const text = document.getElementById('inputText').value;
            if (!text) return;

            log(`[TX] Генерация аудио-пакета...`);

            // Протокол 1: Fast / Normal (звучит как шипение/пшик — быстро и надежно)
            // Использовать Protocol 0 для слышимых тонов или Protocol 1 для ультра-быстрого шипения
            const waveform = ggwaveInstance.encode(text, ggwaveInstance.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 10;

            // Создаем звуковой буфер напрямую
            const buf = ctx.createBuffer(1, waveform.length, ctx.sampleRate);
            buf.getChannelData(0).set(waveform);

            const source = ctx.createBufferSource();
            source.buffer = buf;
            source.connect(ctx.destination);
            source.start();

            log(`[TX] Передача завершена (${text.length} символов).`);
        };

        // ==========================================
        // 2. ПРИЁМНИК (RX)
        // ==========================================
        document.getElementById('listenBtn').onclick = async () => {
            if (isListening) return;
            if (!ggwaveInstance) { alert("Ядро ещё загружается..."); return; }

            const ctx = getAudioContext();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                isListening = true;
                document.getElementById('listenStatus').innerText = "Слушаю...";
                document.getElementById('listenStatus').style.color = "#4ec9b0";

                const source = ctx.createMediaStreamSource(stream);
                // Захватываем звук чанками через ScriptProcessor
                const recorder = ctx.createScriptProcessor(1024, 1, 1);

                // Создаем инстанс захвата в декодере GGWave
                const instanceId = ggwaveInstance.init();

                recorder.onaudioprocess = (e) => {
                    if (!isListening) return;
                    const inputData = e.inputBuffer.getChannelData(0);

                    // Передаем сырые сэмплы прямо в C++ ядро GGWave
                    const res = ggwaveInstance.decode(instanceId, inputData);

                    // Если библиотека смогла расшифровать данные из потока
                    if (res && res.length > 0) {
                        const decodedText = new TextDecoder().decode(res);
                        log(`[RX] УСПЕХ! Приняты данные: "${decodedText}"`);
                        document.getElementById('outputText').value = decodedText;
                    }
                };

                source.connect(recorder);
                recorder.connect(ctx.destination);

            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
            }
        };
    </script>
</body>
</html>
